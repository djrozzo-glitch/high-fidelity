#8f8066;font-size:12px} .hidden{display:none!important}</style></head><body><canvas id="c"></canvas><div id="hud"><header><div><small>CRATES</small><div id="score">0</div></div><div style="text-align:center"><small>STABILITY</small><div id="meter"><div id="fill"></div></div><div id="combo"></div></div><div style="text-align:right"><button id="sound">SOUND ON</button><br><small>BEST <span id="best">0</span></small></div></header><div id="flash"></div><div id="hint">TAP TO DROP · SPACE</div></div><div id="overlay"><div id="panel"><small>THE RECORD SHOP ARCADE</small><h1>High<br>Fidelity.</h1><p id="desc">The new delivery is here. Stack the record crates as high as you can. Keep your balance.</p><button id="start">START SHIFT</button><br><button id="share" class="hidden">SHARE SCORE</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,dpr,scale,base,cam=0,mode='menu',stack=[],moving,score=0,combo=0,best=0,stability=1,particles=[],last=0,t=0,flashUntil=0,sound=true,audio,collapseAt=0,impact=0,shake=0,lean=0,leanV=0,leanTarget=0,fx=[],dangerAt=null;const BPM=80,BEAT=60/BPM;try{best=+localStorage.hfBest||0}catch{}$('#best').textContent=best;
const CW=126,CH=90,D=0,colors=['#c77659','#b7a66e','#668c89','#b9a9b7','#5b637f','#d8c4a0','#a85e56'];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(1.35,W/370,H/540);base=H*.80-CH*scale}addEventListener('resize',resize);resize();function rng(n){return ((Math.sin(n*91.7+3)*43758.5453)%1+1)%1}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}const scenes=[
[0,'bg-01-shop.webp'],
[10,'bg-02-stockroom.webp'],
[25,'bg-03-rooftop.webp'],
[50,'bg-04-clouds.webp'],
[75,'bg-05-orbit.webp']
];
function loadArt(name){const im=new Image();im.src='assets/'+name;return im}
const backgrounds=scenes.map(s=>loadArt(s[1]));
const crates=[1,2,3,4].map(n=>loadArt('crate-0'+n+'.png'));
function ready(im){return im.complete&&im.naturalWidth>0}
function cover(im,x,y,w,h){const z=Math.max(w/im.naturalWidth,h/im.naturalHeight),iw=im.naturalWidth*z,ih=im.naturalHeight*z;g.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function paintScene(im){cover(im,0,0,W,H);if(W>H*.75){g.fillStyle='#171b19aa';g.fillRect(0,0,W,H);const w=H*9/16;cover(im,(W-w)/2,0,w,H)}}
let shownScene=0,previousScene=0,sceneTime=0;
function artBg(){let i=0;while(i+1<scenes.length&&score>=scenes[i+1][0])i++;while(i>0&&!ready(backgrounds[i]))i--;if(!ready(backgrounds[i]))return false;if(i!==shownScene){previousScene=shownScene;shownScene=i;sceneTime=t}paintScene(backgrounds[i]);let a=Math.max(0,1-(t-sceneTime)/1.1);if(previousScene!==i&&a>0&&ready(backgrounds[previousScene])){g.save();g.globalAlpha=a;paintScene(backgrounds[previousScene]);g.restore()}const shade=g.createLinearGradient(0,0,0,H);shade.addColorStop(0,'#171b1977');shade.addColorStop(.23,'#171b1908');shade.addColorStop(.75,'#171b1908');shade.addColorStop(1,'#171b1944');g.fillStyle=shade;g.fillRect(0,0,W,H);return true}

const trimmed=new WeakMap();function spriteBounds(im){if(trimmed.has(im))return trimmed.get(im);const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const data=ctx.getImageData(0,0,cv.width,cv.height).data;let l=cv.width,r=0,top=cv.height,b=0;for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){if(data[(y*cv.width+x)*4+3]>100){l=Math.min(l,x);r=Math.max(r,x);top=Math.min(top,y);b=Math.max(b,y)}}const box=r>l&&b>top?[l,top,r-l+1,b-top+1]:[0,0,cv.width,cv.height];trimmed.set(im,box);return box}function crate(x,y,id,a=0){const im=crates[id%crates.length];if(ready(im)){const [sx,sy,sw,sh]=spriteBounds(im),h=CW*sh/sw;g.save();g.translate(x,y+CH);g.rotate(a);g.shadowColor='rgba(18,10,5,.35)';g.shadowBlur=5;g.shadowOffsetY=3;g.drawImage(im,sx,sy,sw,sh,-CW/2,-h,CW,h);g.restore();return}g.save();g.translate(x,y);g.rotate(a);let l=-CW/2;poly([[l,0],[l+D,-D*.65],[l+CW+D,-D*.65],[l+CW,0]],'#bd8754');poly([[l+CW,0],[l+CW+D,-D*.65],[l+CW+D,CH-D*.65],[l+CW,CH]],'#795035');rect(l,0,CW,CH,'#ad7444');for(let i=0;i<15;i++){let xx=l+5+i*7.7;let hh=18+rng(i+id*19)*7;poly([[xx,7],[xx,7-hh],[xx+D*.7,7-hh-D*.42],[xx+D*.7,7-D*.42]],colors[(i+id)%colors.length]);rect(xx,7-hh,2,hh,'#e2d6b8')}rect(l,12,CW,CH-12,'#b77e48');for(let i=0;i<3;i++)rect(l+3,19+i*8,CW-6,1,'#8c5835');rect(l+3,12,8,CH-12,'#d19a61');rect(l+CW-11,12,8,CH-12,'#d19a61');rect(-15,20,30,7,'#5d3e29');rect(-13,21,26,2,'#3b2d23');g.restore()}
function bg(){if(artBg())return;let level=Math.max(0,(cam)/430);let sky=g.createLinearGradient(0,0,0,H);if(level<1){sky.addColorStop(0,'#202a25');sky.addColorStop(1,'#554b39')}else if(level<2.5){sky.addColorStop(0,'#263747');sky.addColorStop(1,'#b28d68')}else{sky.addColorStop(0,'#11182f');sky.addColorStop(1,'#48556c')}g.fillStyle=sky;g.fillRect(0,0,W,H);if(level<1){let off=cam*scale*.5;for(let side of [-1,1]){let x=W/2+side*W*.34-45*scale;for(let j=0;j<4;j++){let y=H*.19+j*90*scale+off;rect(x,y,90*scale,78*scale,'#302e25');for(let k=0;k<12;k++){let h=(45+rng(k+j*12)*18)*scale;rect(x+4*scale+k*7*scale,y+72*scale-h,5.7*scale,h,colors[(k+j)%7]+'88')}rect(x-4*scale,y+74*scale,98*scale,5*scale,'#8a6b48')}}let yy=base+cam*scale+CH*scale;rect(0,yy,W,H-yy,'#5e4b36');for(let i=0;i<8;i++){g.strokeStyle='#a07c4b55';g.beginPath();g.moveTo(W/2,yy);g.lineTo(i*W/7,H);g.stroke()} }else{for(let i=0;i<35;i++){let x=rng(i+200)*W,y=(rng(i+500)*H+cam*.18*scale)%H;if(level>2.5)rect(x,y,2,2,'#fff9');else{rect(x,y+H*.45,30+rng(i)*50,H*.6,'#26343d88')}}} }
function tone(ok){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?440+Math.min(combo,8)*55:115,audio.currentTime);o.frequency.exponentialRampToValueAtTime(ok?660:55,audio.currentTime+.12);v.gain.setValueAtTime(.12,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch{}}
function spawn(){let top=stack.at(-1);moving={x:0,y:top.y-CH-72,phase:score%2?Math.PI/2:-Math.PI/2,drop:false,v:0,id:score+1};}function reset(){score=combo=0;impact=shake=lean=leanV=leanTarget=0;fx=[];dangerAt=null;shownScene=previousScene=0;sceneTime=0;flashUntil=0;stability=1;stack=[{x:0,y:0,id:0}];particles=[];cam=0;t=0;mode='play';spawn();$('#overlay').classList.add('hidden');$('#hint').textContent='TAP TO DROP · SPACE';updateHud()}function updateHud(){$('#score').textContent=score;$('#best').textContent=best;$('#combo').textContent=combo>1?`PERFECT ×${combo}`:'';$('#fill').style.width=Math.max(0,stability*100)+'%';$('#fill').style.background=stability>.5?'#a7c7a2':stability>.25?'#e6b165':'#dc7463';$('#hint').textContent=dangerAt!==null?'COUNTERBALANCE NOW':stability<.28?'WATCH YOUR BALANCE':'TAP TO DROP · SPACE'}function thud(strength=1){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();const now=audio.currentTime,o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.setValueAtTime(105,now);o.frequency.exponentialRampToValueAtTime(38,now+.16);v.gain.setValueAtTime(.14*strength,now);v.gain.exponentialRampToValueAtTime(.001,now+.19);o.connect(v).connect(audio.destination);o.start();o.stop(now+.2);const len=Math.round(audio.sampleRate*.12),b=audio.createBuffer(1,len,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const n=audio.createBufferSource(),lp=audio.createBiquadFilter(),ng=audio.createGain();n.buffer=b;lp.type='lowpass';lp.frequency.value=950;ng.gain.value=.11*strength;n.connect(lp).connect(ng).connect(audio.destination);n.start()}catch{}}function drop(){if(mode==='play'&&moving&&!moving.drop){moving.drop=true;moving.v=35;}}function evaluateBalance(){let risk=0,sum=0,tilt=0;for(let i=stack.length-2;i>=0;i--){sum+=stack[i+1].x;const mean=sum/(stack.length-i-1),left=Math.max(stack[i].x-CW/2,stack[i+1].x-CW/2),right=Math.min(stack[i].x+CW/2,stack[i+1].x+CW/2),signed=(mean-(left+right)/2)/Math.max(1,(right-left)/2);if(Math.abs(signed)>risk){risk=Math.abs(signed);tilt=signed}}return {risk,tilt}}
function burst(x,y,perfect){for(let i=0;i<(perfect?18:10);i++){const angle=Math.random()*Math.PI*2,speed=25+Math.random()*100;fx.push({x:x+(Math.random()-.5)*CW*.8,y,vx:Math.cos(angle)*speed,vy:-20-Math.random()*60,life:.25+Math.random()*.45,max:.7,size:1+Math.random()*2.8,perfect})}if(perfect)fx.push({x,y,life:.45,max:.45,ring:true,perfect:true})}
function land(){let top=stack.at(-1),dx=moving.x-top.x,perfect=Math.abs(dx)<9;if(Math.abs(dx)>CW*.88){fail();return}const before=stability;if(perfect){moving.x=top.x;combo++;$('#flash').textContent=combo===1?'MINT CONDITION':combo>=5?'IN THE GROOVE':'PERFECT!';flashUntil=t+.85;tone(true)}else{combo=0;$('#flash').textContent='';}let item={x:moving.x,y:top.y-CH,id:moving.id,landed:t};stack.push(item);score++;const {risk,tilt}=evaluateBalance();stability=Math.max(0,1-risk);leanTarget=Math.max(-1,Math.min(1,tilt));leanV+=dx*.014;impact=1;shake=perfect?.25:.7;thud(perfect?.65:1);burst(item.x,item.y+CH,perfect);best=Math.max(score,best);try{localStorage.hfBest=best}catch{}if(risk>=1.18){updateHud();fail();return}if(risk>=1){if(dangerAt===null)dangerAt=t;$('#flash').textContent='SAVE THE STACK!';flashUntil=t+1.1}else{dangerAt=null;if(stability-before>.18&&!perfect){$('#flash').textContent='BALANCE SAVED';flashUntil=t+.85}else if([12,33,45,78,100].includes(score)){$('#flash').textContent=({12:'12-INCH MASTER',33:'33⅓ RPM',45:'45 RPM',78:'OLD SCHOOL',100:'LEGENDARY CRATE DIGGER'})[score];flashUntil=t+1.2}}updateHud();spawn()}
function fail(){if(mode!=='play')return;mode='collapse';collapseAt=t;shake=1.5;dangerAt=null;$('#hint').textContent='';let all=[...stack];if(moving&&all.at(-1).id!==moving.id)all.push(moving);for(let q of all){if(base+(q.y+cam)*scale<-CH*scale||base+(q.y+cam)*scale>H+CH*scale)continue;let dir=Math.sign(lean||q.x||1);particles.push({...q,x:q.x,vx:dir*(50+Math.random()*120)+(Math.random()-.5)*100,vy:-45-Math.random()*90,a:0,va:dir*(1+Math.random()*3),crate:true});for(let k=0;k<10;k++)particles.push({x:q.x+(Math.random()-.5)*CW,y:q.y+CH*.3,vx:(Math.random()-.5)*570,vy:-50-Math.random()*280,a:Math.random()*6.28,va:(Math.random()-.5)*12,col:colors[k%colors.length],kind:k<5?'vinyl':k<8?'sleeve':'wood',size:8+Math.random()*9,spin:Math.random()*6.28})}thud(1.5);tone(false)}
function debris(p){g.save();g.translate(p.x,p.y);g.rotate(p.a);let r=p.size;if(p.kind==='vinyl'){let squash=.18+.82*Math.abs(Math.cos(p.spin));g.scale(1,squash);let grad=g.createLinearGradient(-r,-r,r,r);grad.addColorStop(0,'#08090b');grad.addColorStop(.4,'#34363b');grad.addColorStop(.55,'#101114');grad.addColorStop(1,'#050506');g.fillStyle=grad;g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.fill();g.strokeStyle='#ffffff28';g.lineWidth=.5;for(let i=1;i<=4;i++){g.beginPath();g.arc(0,0,r*(.35+i*.13),0,Math.PI*2);g.stroke()}g.fillStyle=p.col;g.beginPath();g.arc(0,0,r*.32,0,Math.PI*2);g.fill();g.fillStyle='#111';g.beginPath();g.arc(0,0,r*.06,0,Math.PI*2);g.fill()}else if(p.kind==='sleeve'){g.scale(1,.35+.65*Math.abs(Math.cos(p.spin)));rect(-r,-r,r*2,r*2,p.col);rect(-r+1,-r+1,r*2-2,r*2-2,'#25232188');g.strokeStyle='#f6e8cc88';g.beginPath();g.arc(0,0,r*.65,0,Math.PI*2);g.stroke()}else{rect(-r*.6,-2,r*1.2,4,'#a67c52');rect(-r*.6,-2,r*1.2,1,'#d7ac79')}g.restore()}
function end(){mode='over';$('#desc').textContent=`Shift over. You stacked ${score} ${score===1?'crate':'crates'}. That's ${(score*50).toLocaleString('en-US')} records. Best: ${best}.`;$('#start').textContent='TRY AGAIN';$('#share').classList.remove('hidden');$('#overlay').classList.remove('hidden')}
function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;t+=dt;impact*=Math.exp(-dt*9);shake*=Math.exp(-dt*7);leanV+=(leanTarget-lean)*18*dt;leanV*=Math.exp(-dt*4);lean+=leanV*dt;for(let p of fx){p.life-=dt;if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}}fx=fx.filter(p=>p.life>0);if(mode==='play'&&dangerAt!==null&&t-dangerAt>5)fail();if(mode==='play'){if(moving.drop){moving.v+=2300*dt;moving.y+=moving.v*dt;if(moving.y>=stack.at(-1).y-CH){moving.y=stack.at(-1).y-CH;land()}}else{moving.phase+=dt*(Math.PI*2/(BEAT*4))*(1+Math.min(score,65)*.017);let span=Math.max(65,Math.min(118,W/scale/2-CW/2-18));moving.x=Math.max(-span,Math.min(span,stack.at(-1).x*.35+Math.sin(moving.phase)*span))}let target=Math.max(0,-stack.at(-1).y-Math.max(0,(base-H*.43)/scale));cam+=(target-cam)*Math.min(1,dt*5)}if(mode==='collapse'){const slow=t-collapseAt<.65?.38:.85;for(let p of particles){let step=dt*slow;p.vy+=680*step;p.x+=p.vx*step;p.y+=p.vy*step;p.a+=p.va*step;if(p.spin!==undefined)p.spin+=step*7}if(t-collapseAt>2.7)end()}bg();if((mode==='play'||mode==='menu')&&cam*scale<H*.2){g.save();const fy=base+(cam+CH)*scale;g.translate(W/2,fy);g.scale(scale,scale);const shadow=g.createRadialGradient(0,0,0,0,0,CW*.75);shadow.addColorStop(0,'#150c08aa');shadow.addColorStop(1,'#150c0800');g.scale(1,.18);g.fillStyle=shadow;g.fillRect(-CW,-CW,CW*2,CW*2);g.restore()}g.save();g.translate(W/2+Math.sin(t*75)*shake*4,base+cam*scale+Math.sin(t*61)*shake*3);g.scale(scale,scale);if(mode==='play'||mode==='menu'){let s=stack.length?stack:[{x:0,y:0,id:0},{x:3,y:-CH,id:1},{x:-3,y:-CH*2,id:2}];for(let q of s){if(q.y+cam>H/scale||base+(q.y+cam+CH)*scale<0)continue;let sway=mode==='play'?(lean*1.7+Math.sin(t*3)*(1-stability)*.55)*Math.min(q.id,12):0;let bounce=q.landed===undefined?0:-Math.sin(Math.min(1,(t-q.landed)*5)*Math.PI)*3;crate(q.x+sway,q.y+bounce+impact*Math.min(3,q.id*.15),q.id,mode==='play'?lean*.018*Math.min(q.id,8)/8:0)}if(moving&&mode==='play'){g.strokeStyle=Math.abs(moving.x-stack.at(-1).x)<9?'#ffdf9cbb':'#f3d1a733';g.setLineDash([4,5]);g.beginPath();g.moveTo(moving.x,moving.y+CH);g.lineTo(moving.x,stack.at(-1).y);g.stroke();g.setLineDash([]);crate(moving.x,moving.y,moving.id)}}else for(let p of particles){if(p.crate)crate(p.x,p.y,p.id,p.a);else debris(p)}for(let p of fx){g.save();g.globalAlpha=Math.min(1,p.life/p.max);if(p.ring){g.strokeStyle='#ffde9b';g.lineWidth=1.5;g.beginPath();g.ellipse(p.x,p.y,10+(1-p.life/p.max)*78,2+(1-p.life/p.max)*9,0,0,Math.PI*2);g.stroke()}else{g.fillStyle=p.perfect?'#ffd78c':'#c6a47a';g.beginPath();g.arc(p.x,p.y,p.size,0,Math.PI*2);g.fill()}g.restore()}g.restore();$('#flash').style.opacity=mode==='play'?Math.max(0,Math.min(1,(flashUntil-t)*3)):0;requestAnimationFrame(frame)}requestAnimationFrame(frame);c.addEventListener('pointerdown',drop);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();mode==='play'?drop():mode!=='collapse'&&reset()}});$('#start').onclick=()=>{tone(true);reset()};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='SOUND '+(sound?'ON':'OFF')};$('#share').onclick=async()=>{let text=`I stacked ${score} crates in High Fidelity. Can you beat me?`;try{if(navigator.share)await navigator.share({title:'High Fidelity',text,url:location.protocol.startsWith('http')?location.href:undefined});else{await navigator.clipboard.writeText(text+(location.protocol.startsWith('http')?' '+location.href:''));$('#share').textContent='COPIED!'}}catch{}};
