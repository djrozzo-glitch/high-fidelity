function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(gamePaused){requestAnimationFrame(frame);return}t+=dt;impact*=Math.exp(-dt*9);shake*=Math.exp(-dt*7);leanV+=(leanTarget-lean)*18*dt;leanV*=Math.exp(-dt*4);lean+=leanV*dt;for(let p of fx){p.life-=dt;if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}}fx=fx.filter(p=>p.life>0);if(mode==='play'&&dangerAt!==null&&t-dangerAt>5)fail();if(mode==='play'){if(moving.drop){moving.v+=2300*dt;moving.y+=moving.v*dt;if(moving.y>=stack.at(-1).y-CH){moving.y=stack.at(-1).y-CH;land()}}else{moving.phase+=dt*(Math.PI*2/(BEAT*4))*(1+Math.min(score,65)*.017)*(grooveLeft>0?.72:1);let span=Math.max(55,Math.min(100,W/scale/2-CW/2-18));moving.x=Math.max(-span,Math.min(span,stack.at(-1).x*.35+Math.sin(moving.phase)*span))}let target=Math.max(0,-stack.at(-1).y-Math.max(0,(base-Math.max(H*.43,Math.min(H*.64,($('#hud header').offsetHeight+22)/1+(CH+64)*scale)))/scale));cam+=(target-cam)*Math.min(1,dt*5)}if(mode==='collapse'){const slow=t-collapseAt<.65?.38:.85;for(let p of particles){let step=dt*slow;p.vy+=680*step;p.x+=p.vx*step;p.y+=p.vy*step;p.a+=p.va*step;if(p.spin!==undefined)p.spin+=step*7}if(t-collapseAt>2.7)end()}bg();ambient();drawClerk();if((mode==='play'||mode==='menu')&&cam*scale<H*.2){g.save();const fy=base+(cam+CH)*scale;g.translate(W/2,fy);g.scale(scale,scale);const shadow=g.createRadialGradient(0,0,0,0,0,CW*.75);shadow.addColorStop(0,'#150c08aa');shadow.addColorStop(1,'#150c0800');g.scale(1,.18);g.fillStyle=shadow;g.fillRect(-CW,-CW,CW*2,CW*2);g.restore()}g.save();g.translate(W/2+Math.sin(t*75)*shake*4,base+cam*scale+Math.sin(t*61)*shake*3);g.scale(scale,scale);if(mode==='play'||mode==='menu'){let s=stack.length?stack:[{x:0,y:0,id:0},{x:3,y:-CH,id:1},{x:-3,y:-CH*2,id:2}];for(let q of s){if(q.y+cam>H/scale||base+(q.y+cam+CH)*scale<0)continue;let sway=mode==='play'?(lean*1.7+Math.sin(t*3)*(1-stability)*.55)*Math.min(q.id,12):0;let bounce=q.landed===undefined?0:-Math.sin(Math.min(1,(t-q.landed)*5)*Math.PI)*3;crate(q.x+sway,q.y+bounce+impact*Math.min(3,q.id*.15),q.id,mode==='play'?lean*.018*Math.min(q.id,8)/8:0)}if(moving&&mode==='play'){const top=stack.at(-1),overlap=Math.max(0,CW-Math.abs(moving.x-top.x));if(!moving.drop&&overlap>0){g.save();const left=Math.max(moving.x-CW/2,top.x-CW/2);const marker=g.createLinearGradient(0,top.y-4,0,top.y+5);marker.addColorStop(0,'#f1be7433');marker.addColorStop(1,'#f1be7400');g.fillStyle=marker;g.fillRect(left,top.y-4,overlap,9);g.restore()}g.strokeStyle=Math.abs(moving.x-stack.at(-1).x)<(grooveLeft>0?11:8)?'#ffdf9cbb':'#f3d1a733';g.setLineDash([4,5]);g.beginPath();g.moveTo(moving.x,moving.y+CH);g.lineTo(moving.x,stack.at(-1).y);g.stroke();g.setLineDash([]);crate(moving.x,moving.y,moving.id)}}else for(let p of particles){if(p.crate)crate(p.x,p.y,p.id,p.a);else debris(p)}for(let p of fx){g.save();g.globalAlpha=Math.min(1,p.life/p.max);if(p.ring){g.strokeStyle='#ffde9b';g.lineWidth=1.5;g.beginPath();g.ellipse(p.x,p.y,10+(1-p.life/p.max)*78,2+(1-p.life/p.max)*9,0,0,Math.PI*2);g.stroke()}else{g.fillStyle=p.perfect?'#ffd78c':'#c6a47a';g.beginPath();g.arc(p.x,p.y,p.size,0,Math.PI*2);g.fill()}g.restore()}g.restore();if(playlistReady){const beatPhase=music.currentTime%BEAT;$('#beatDot').style.opacity=String(music.paused?.2:.35+.65*Math.exp(-beatPhase*9))}const flashAlpha=mode==='play'?Math.max(0,Math.min(1,(flashUntil-t)*3)):0;$('#flash').style.opacity=flashAlpha;$('#flash').style.transform='translateY('+((1-flashAlpha)*-7)+'px)';requestAnimationFrame(frame)}requestAnimationFrame(frame);c.addEventListener('pointerdown',drop);addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Escape'&&(mode==='play'||mode==='collapse')){e.preventDefault();setGamePaused(!gamePaused);return}if(e.code==='Space'&&!['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();gamePaused?setGamePaused(false):mode==='play'?drop():mode!=='collapse'&&reset()}});$('#start').onclick=()=>{if(!crates.some(ready)){ $('#desc').textContent='Loading the record crates…';return }tone(true);reset()};$('#sound').onclick=()=>{sound=!sound;syncSoundUI();try{localStorage.hfSfx=sound?'on':'off'}catch{}};$('#share').onclick=async()=>{let text=`I stacked ${score} crates in High Fidelity. Can you beat me?`;const shareUrl='https://weirdflex.online/highfidelity/';try{if(navigator.share)await navigator.share({title:'High Fidelity',text,url:shareUrl});else{await navigator.clipboard.writeText(text+' '+shareUrl);$('#share').textContent='COPIED!'}}catch{}};
