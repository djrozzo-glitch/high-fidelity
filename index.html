<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171b19"><title>High Fidelity — Stack the Wax</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#171b19;color:#f6e8cc;font-family:system-ui,sans-serif;touch-action:none;user-select:none}canvas{width:100%;height:100%;display:block}#hud{position:absolute;inset:0;pointer-events:none;padding: max(18px,env(safe-area-inset-top)) 22px;display:flex;flex-direction:column;align-items:center}header{width:min(100%,600px);display:flex;justify-content:space-between;align-items:center}small{font-size:10px;letter-spacing:2px;color:#c1b6a1}#score{font-size:46px;font-weight:800;line-height:1}#combo{font-size:12px;color:#f0b867;letter-spacing:2px;text-align:center;margin-top:14px}#meter{width:120px;height:4px;background:#ffffff25;margin-top:7px;border-radius:4px;overflow:hidden}#fill{height:100%;background:#a7c7a2;width:100%;transition:width .2s}button{font:inherit;cursor:pointer;color:#201e19;background:#ebbd76;border:0;padding:15px 25px;border-radius:6px;font-weight:800;letter-spacing:1px;pointer-events:auto}#sound{background:#282e2b;color:#eee2cc;padding:9px 12px;font-size:12px}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#101613a8;padding:24px;backdrop-filter:blur(5px)}#panel{max-width:370px;text-align:center}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(58px,13vw,88px);line-height:.86;letter-spacing:-5px;margin:20px 0}p{color:#d6ccb8;line-height:1.5;font-size:15px}#hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:3px;color:#e8d4b4}#flash{position:absolute;top:23%;font-weight:900;font-size:25px;color:#f8c982;opacity:0;text-shadow:0 2px 10px #000}#share{margin-top:10px;background:transparent;color:#e8d4b4;border:1px solid #8f8066;font-size:12px} .hidden{display:none!important}</style></head><body><canvas id="c"></canvas><div id="hud"><header><div><small>CRATES</small><div id="score">0</div></div><div style="text-align:center"><small>STABILITY</small><div id="meter"><div id="fill"></div></div><div id="combo"></div></div><div style="text-align:right"><button id="sound">SOUND ON</button><br><small>BEST <span id="best">0</span></small></div></header><div id="flash"></div><div id="hint">TAP TO DROP · SPACE</div></div><div id="overlay"><div id="panel"><small>THE RECORD SHOP ARCADE</small><h1>High<br>Fidelity.</h1><p id="desc">The new delivery is here. Stack the record crates as high as you can. Keep your balance.</p><button id="start">START SHIFT</button><br><button id="share" class="hidden">SHARE SCORE</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,dpr,scale,base,cam=0,mode='menu',stack=[],moving,score=0,combo=0,best=0,stability=1,particles=[],last=0,t=0,flashUntil=0,sound=true,audio,collapseAt=0;try{best=+localStorage.hfBest||0}catch{}$('#best').textContent=best;
const CW=126,CH=43,D=23,colors=['#c77659','#b7a66e','#668c89','#b9a9b7','#5b637f','#d8c4a0','#a85e56'];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(1.35,W/370,H/540);base=H*.80}addEventListener('resize',resize);resize();function rng(n){return ((Math.sin(n*91.7+3)*43758.5453)%1+1)%1}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function crate(x,y,id,a=0){g.save();g.translate(x,y);g.rotate(a);let l=-CW/2;poly([[l,0],[l+D,-D*.65],[l+CW+D,-D*.65],[l+CW,0]],'#bd8754');poly([[l+CW,0],[l+CW+D,-D*.65],[l+CW+D,CH-D*.65],[l+CW,CH]],'#795035');rect(l,0,CW,CH,'#ad7444');for(let i=0;i<15;i++){let xx=l+5+i*7.7;let hh=18+rng(i+id*19)*7;poly([[xx,7],[xx,7-hh],[xx+D*.7,7-hh-D*.42],[xx+D*.7,7-D*.42]],colors[(i+id)%colors.length]);rect(xx,7-hh,2,hh,'#e2d6b8')}rect(l,12,CW,CH-12,'#b77e48');for(let i=0;i<3;i++)rect(l+3,19+i*8,CW-6,1,'#8c5835');rect(l+3,12,8,CH-12,'#d19a61');rect(l+CW-11,12,8,CH-12,'#d19a61');rect(-15,20,30,7,'#5d3e29');rect(-13,21,26,2,'#3b2d23');g.restore()}
function bg(){let level=Math.max(0,(cam)/430);let sky=g.createLinearGradient(0,0,0,H);if(level<1){sky.addColorStop(0,'#202a25');sky.addColorStop(1,'#554b39')}else if(level<2.5){sky.addColorStop(0,'#263747');sky.addColorStop(1,'#b28d68')}else{sky.addColorStop(0,'#11182f');sky.addColorStop(1,'#48556c')}g.fillStyle=sky;g.fillRect(0,0,W,H);if(level<1){let off=cam*scale*.5;for(let side of [-1,1]){let x=W/2+side*W*.34-45*scale;for(let j=0;j<4;j++){let y=H*.19+j*90*scale+off;rect(x,y,90*scale,78*scale,'#302e25');for(let k=0;k<12;k++){let h=(45+rng(k+j*12)*18)*scale;rect(x+4*scale+k*7*scale,y+72*scale-h,5.7*scale,h,colors[(k+j)%7]+'88')}rect(x-4*scale,y+74*scale,98*scale,5*scale,'#8a6b48')}}let yy=base+cam*scale+CH*scale;rect(0,yy,W,H-yy,'#5e4b36');for(let i=0;i<8;i++){g.strokeStyle='#a07c4b55';g.beginPath();g.moveTo(W/2,yy);g.lineTo(i*W/7,H);g.stroke()} }else{for(let i=0;i<35;i++){let x=rng(i+200)*W,y=(rng(i+500)*H+cam*.18*scale)%H;if(level>2.5)rect(x,y,2,2,'#fff9');else{rect(x,y+H*.45,30+rng(i)*50,H*.6,'#26343d88')}}} }
function tone(ok){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?440+Math.min(combo,8)*55:115,audio.currentTime);o.frequency.exponentialRampToValueAtTime(ok?660:55,audio.currentTime+.12);v.gain.setValueAtTime(.12,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch{}}
function spawn(){let top=stack.at(-1);moving={x:0,y:top.y-CH-100,phase:Math.PI/2,drop:false,v:0,id:score+1};}function reset(){score=combo=0;stability=1;stack=[{x:0,y:0,id:0}];particles=[];cam=0;t=0;mode='play';spawn();$('#overlay').classList.add('hidden');$('#hint').textContent='TAP TO DROP · SPACE';updateHud()}function updateHud(){$('#score').textContent=score;$('#best').textContent=best;$('#combo').textContent=combo>1?`PERFECT ×${combo}`:'';$('#fill').style.width=Math.max(0,stability*100)+'%';$('#fill').style.background=stability>.5?'#a7c7a2':stability>.25?'#e6b165':'#dc7463'}function drop(){if(mode==='play'&&!moving.drop){moving.drop=true;tone(false)}}function land(){let top=stack.at(-1),dx=moving.x-top.x,perfect=Math.abs(dx)<9;if(Math.abs(dx)>CW*.88){fail();return}if(perfect){moving.x=top.x;combo++;stability=Math.min(1,stability+.15);$('#flash').textContent='PERFECT!';flashUntil=t+.7;tone(true)}else{combo=0;$('#flash').textContent='';}let item={x:moving.x,y:top.y-CH,id:moving.id};stack.push(item);score++;let risk=0;for(let i=0;i<stack.length-1;i++){let sum=0;for(let j=i+1;j<stack.length;j++)sum+=stack[j].x;let mean=sum/(stack.length-i-1);let left=Math.max(stack[i].x-CW/2,stack[i+1].x-CW/2),right=Math.min(stack[i].x+CW/2,stack[i+1].x+CW/2);let r=Math.abs(mean-(left+right)/2)/Math.max(1,(right-left)/2);risk=Math.max(risk,r)}stability=Math.max(0,1-risk);best=Math.max(score,best);try{localStorage.hfBest=best}catch{}updateHud();if(risk>=1){fail();return}spawn()}
function fail(){mode='collapse';collapseAt=t;$('#hint').textContent='';let all=[...stack];if(moving&&all.at(-1).id!==moving.id)all.push(moving);for(let q of all){if(q.y+cam<-H/scale||q.y+cam>H/scale)continue;particles.push({...q,vx:(rng(q.id+80)-.5)*420,vy:-80-rng(q.id)*100,a:0,va:(rng(q.id+99)-.5)*6,crate:true});for(let k=0;k<5;k++)particles.push({x:q.x,y:q.y,vx:(rng(q.id*9+k)-.5)*500,vy:-rng(k+q.id)*240,a:0,va:4-rng(k)*8,col:colors[k],crate:false})}tone(false)}function end(){mode='over';$('#desc').textContent=`Shift over. You stacked ${score} ${score===1?'crate':'crates'}. Best: ${best}.`;$('#start').textContent='TRY AGAIN';$('#share').classList.remove('hidden');$('#overlay').classList.remove('hidden')}
function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;t+=dt;if(mode==='play'){if(moving.drop){moving.v+=2300*dt;moving.y+=moving.v*dt;if(moving.y>=stack.at(-1).y-CH){moving.y=stack.at(-1).y-CH;land()}}else{moving.phase+=dt*(2.0+Math.min(score,65)*.037);let span=Math.max(65,Math.min(118,W/scale/2-CW/2-18));moving.x=Math.max(-span,Math.min(span,stack.at(-1).x*.35+Math.sin(moving.phase)*span))}let target=Math.max(0,-stack.at(-1).y-155);cam+=(target-cam)*Math.min(1,dt*5)}if(mode==='collapse'){for(let p of particles){p.vy+=780*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt}if(t-collapseAt>1.8)end()}bg();g.save();g.translate(W/2-D*scale/2,base+cam*scale);g.scale(scale,scale);if(mode==='play'||mode==='menu'){let s=stack.length?stack:[{x:0,y:0,id:0},{x:3,y:-CH,id:1},{x:-3,y:-CH*2,id:2}];for(let q of s){if(q.y+cam>H/scale)continue;let sway=mode==='play'?Math.sin(t*3+q.id*.1)*(1-stability)*Math.min(q.id,10)*.65:0;crate(q.x+sway,q.y,q.id)}if(moving&&mode==='play'){g.strokeStyle='#f3d1a744';g.setLineDash([4,5]);g.beginPath();g.moveTo(moving.x,moving.y+CH);g.lineTo(moving.x,stack.at(-1).y);g.stroke();g.setLineDash([]);crate(moving.x,moving.y,moving.id)}}else for(let p of particles){if(p.crate)crate(p.x,p.y,p.id,p.a);else{g.save();g.translate(p.x,p.y);g.rotate(p.a);rect(-9,-9,18,18,p.col);g.beginPath();g.arc(0,0,7,0,Math.PI*2);g.fillStyle='#252321';g.fill();g.restore()}}g.restore();$('#flash').style.opacity=mode==='play'?Math.max(0,Math.min(1,(flashUntil-t)*3)):0;requestAnimationFrame(frame)}requestAnimationFrame(frame);c.addEventListener('pointerdown',drop);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();mode==='play'?drop():mode!=='collapse'&&reset()}});$('#start').onclick=()=>{tone(true);reset()};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='SOUND '+(sound?'ON':'OFF')};$('#share').onclick=async()=>{let text=`I stacked ${score} crates in High Fidelity. Can you beat me?`;try{if(navigator.share)await navigator.share({title:'High Fidelity',text,url:location.protocol.startsWith('http')?location.href:undefined});else{await navigator.clipboard.writeText(text+(location.protocol.startsWith('http')?' '+location.href:''));$('#share').textContent='COPIED!'}}catch{}};
</script></body></html>
